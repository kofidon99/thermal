<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Thermal - a one-button glider. Hold to dive, let go to climb, and read the air: slow through the warm, fast through the cool.">
<meta name="theme-color" content="#cfeefb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23cfeefb'/%3E%3Cpath d='M7 20c3-7 9-11 15-11-2 5-4 8-7 10 2 0 4 0 6-1-3 4-8 6-14 2z' fill='%23ff8a3d'/%3E%3Cpath d='M22 9c-6 0-12 4-15 11' stroke='%23c85a26' stroke-width='1.2' fill='none'/%3E%3C/svg%3E">
<style>*{box-sizing:border-box}html,body{margin:0;padding:0;height:100%;background:#cfeefb}
img{max-width:100%}[hidden]{display:none!important}</style>
<title>Thermal</title>
<style>
  :root{ color-scheme: light; }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:#cfeefb; color:#123448; overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #app{
    position:fixed; inset:0; overflow:hidden; background:#cfeefb;
    touch-action:none; user-select:none; -webkit-user-select:none;
  }
  #c{ display:block; position:absolute; inset:0; }

  #sysbar{ position:absolute; top:14px; right:14px; z-index:6; display:flex; gap:9px; }
  .sysbtn{
    width:42px; height:42px; border-radius:13px; border:1px solid rgba(18,52,72,.22);
    background:rgba(247,253,255,.75); color:#1a6d96; cursor:pointer; padding:0;
    display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    transition:transform .12s ease, background .12s ease;
  }
  .sysbtn:hover{ background:#f7fdff; }
  .sysbtn:active{ transform:scale(.92); }
  .sysbtn svg{ width:20px; height:20px; display:block; }

  .overlay{
    position:absolute; inset:0; z-index:5; padding:24px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:15px;
    text-align:center;
    background:radial-gradient(120% 92% at 50% 40%, rgba(242,252,255,.88) 0%, rgba(166,217,240,.96) 74%);
    color:#123448;
  }
  .logo{
    font-size:clamp(40px,12vmin,80px); font-weight:900; letter-spacing:-.02em; line-height:.92;
    margin:0; text-transform:uppercase; color:#0f6ea8;
    text-shadow:0 3px 0 #a8dcf2, 0 9px 24px rgba(18,90,130,.3);
  }
  .tagline{
    margin:0; font-size:clamp(11px,2.8vmin,13px); letter-spacing:.3em; text-transform:uppercase;
    color:#1a7fa8; font-weight:800;
  }
  .btn{
    appearance:none; -webkit-appearance:none; border:0; cursor:pointer; font-family:inherit;
    font-size:clamp(15px,3.6vmin,18px); font-weight:900; letter-spacing:.15em; text-transform:uppercase;
    padding:17px 42px; border-radius:16px; color:#4a2408; margin-top:4px;
    background:linear-gradient(180deg,#ffc178 0%,#f5892f 100%);
    box-shadow:0 5px 0 #bc5a17, 0 12px 26px rgba(120,70,20,.28);
    transition:transform .1s ease, box-shadow .1s ease;
  }
  .btn:hover{ background:linear-gradient(180deg,#ffd096 0%,#ff9a45 100%); }
  .btn:active{ transform:translateY(4px); box-shadow:0 1px 0 #bc5a17, 0 6px 14px rgba(120,70,20,.3); }
  .btn.ghost{
    background:transparent; color:#1a6d96; padding:12px 26px; font-size:13px; letter-spacing:.18em;
    box-shadow:0 0 0 1px rgba(26,109,150,.34) inset;
  }
  .btn.ghost:hover{ background:rgba(255,255,255,.46); }
  .btn.ghost:active{ transform:translateY(2px); box-shadow:0 0 0 1px rgba(26,109,150,.34) inset; }
  .hint{
    margin:6px 0 0; font-size:clamp(11px,2.7vmin,13px); line-height:1.75; color:#3c7490;
    letter-spacing:.04em; max-width:35ch;
  }
  .hint b{ color:#123448; font-weight:800; }

  .scorecard{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  .stat{
    min-width:126px; padding:14px 20px; border-radius:18px;
    background:rgba(247,253,255,.8); border:1px solid rgba(26,109,150,.2);
  }
  .stat .k{ font-size:10px; letter-spacing:.26em; text-transform:uppercase; color:#5e93ac; font-weight:800; }
  .stat .v{ font-size:clamp(28px,7.4vmin,40px); font-weight:900; color:#123448; line-height:1.15; }
  .stat.best .v{ color:#e2703a; }
  .headline{
    margin:0; font-size:clamp(26px,7.6vmin,44px); font-weight:900; letter-spacing:.02em; text-transform:uppercase;
    color:#0f6ea8; text-shadow:0 3px 0 #a8dcf2;
  }
  .record{ margin:0; font-size:12px; font-weight:900; letter-spacing:.28em; text-transform:uppercase; color:#e2703a; }
  .runstats{
    margin:0; font-size:12px; letter-spacing:.12em; color:#3c7490; text-transform:uppercase;
    font-weight:800; line-height:1.9; max-width:32ch; text-wrap:balance;
  }

  :focus-visible{ outline:3px solid #f5892f; outline-offset:3px; }

  .tiers{ display:flex; gap:8px; justify-content:center; margin:2px 0 0; width:100%; max-width:430px; }
  .tier{
    appearance:none; -webkit-appearance:none; cursor:pointer; font-family:inherit;
    border:1px solid rgba(26,109,150,.24); background:rgba(247,253,255,.66); color:#3c7490;
    padding:11px 9px; border-radius:14px; flex:1 1 0; min-width:0;
    display:flex; flex-direction:column; gap:4px; align-items:center; justify-content:center;
    transition:border-color .14s ease, background .14s ease, transform .12s ease, color .14s ease;
  }
  .tier:hover{ background:#f7fdff; }
  .tier:active{ transform:scale(.97); }
  .tier .tn{ font-size:12px; font-weight:900; letter-spacing:.1em; text-transform:uppercase; }
  .tier .tb{ font-size:10px; letter-spacing:.02em; line-height:1.3; color:#5e93ac; }
  .tier[aria-checked="true"]{
    border-color:#1a90c8; background:#d8f1fd; color:#0f6ea8;
    box-shadow:0 0 0 2px rgba(26,144,200,.3);
  }
  .tier[aria-checked="true"] .tb{ color:#1a7fa8; }

  .suggest{
    display:flex; flex-direction:column; gap:9px; align-items:center; margin:0;
    padding:13px 18px; border-radius:16px;
    background:rgba(216,241,253,.9); border:1px solid rgba(26,144,200,.42);
  }
  .suggest .msg{ margin:0; font-size:12px; letter-spacing:.05em; color:#0f6ea8; font-weight:800; max-width:31ch; }
  .suggest .btn.ghost{ margin:0; color:#0f6ea8; box-shadow:0 0 0 1px rgba(26,144,200,.5) inset; }

  .legend{ display:flex; gap:18px; justify-content:center; align-items:center; margin:2px 0 0; flex-wrap:wrap; }
  .lg{ display:flex; align-items:center; gap:7px; font-size:11px; font-weight:800; letter-spacing:.12em;
       text-transform:uppercase; color:#3c7490; }
  .lg i{ width:14px; height:22px; border-radius:7px; display:block; }
  .lg i.lift{ background:linear-gradient(0deg,#ffd27a 0%,#ff9f3c 100%); box-shadow:0 0 0 1px rgba(160,90,20,.35); }
  .lg i.sink{ background:linear-gradient(180deg,#93aede 0%,#5d7cbb 100%); box-shadow:0 0 0 1px rgba(40,60,110,.35); }
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>

  <div id="sysbar">
    <button class="sysbtn" id="btnSound" type="button" aria-label="Toggle sound"></button>
    <button class="sysbtn" id="btnPause" type="button" aria-label="Pause"></button>
  </div>

  <div class="overlay" id="ovMenu">
    <h1 class="logo">Thermal</h1>
    <p class="tagline">Hold to dive · let go to climb</p>
    <div class="legend">
      <span class="lg"><i class="lift"></i>Warm air lifts</span>
      <span class="lg"><i class="sink"></i>Cool air drops</span>
    </div>
    <div class="tiers" id="tierPick" role="radiogroup" aria-label="Difficulty"></div>
    <button class="btn" id="btnPlay" type="button">Launch</button>
    <p class="hint" id="menuHint"></p>
  </div>

  <div class="overlay" id="ovOver" hidden>
    <h2 class="headline" id="overTitle">Grounded</h2>
    <p class="record" id="newRecord" hidden>New Record</p>
    <div class="scorecard">
      <div class="stat"><div class="k">Score</div><div class="v" id="finalScore">0</div></div>
      <div class="stat best"><div class="k" id="bestLabel">Best</div><div class="v" id="bestScore">0</div></div>
    </div>
    <p class="runstats" id="runStats"></p>
    <div class="suggest" id="suggestBox" hidden>
      <p class="msg" id="suggestMsg"></p>
      <button class="btn ghost" id="btnSuggest" type="button"></button>
    </div>
    <button class="btn" id="btnAgain" type="button">Again</button>
    <button class="btn ghost" id="btnMenu" type="button">Menu</button>
  </div>

  <div class="overlay" id="ovPause" hidden>
    <h2 class="headline">Paused</h2>
    <button class="btn" id="btnResume" type="button">Resume</button>
    <button class="btn ghost" id="btnQuit" type="button">End Flight</button>
  </div>
</div>

<script>
(function () {
  'use strict';
  /* =========================================================================
     1. PLATFORM BRIDGE — YouTube Playables SDK with safe fallbacks.
     ========================================================================= */
  var YT = (typeof window !== 'undefined' && window.ytgame) ? window.ytgame : null;

  var Platform = {
    audioAllowed: true, _firstFrameSent: false, _readySent: false,

    init: function (onPause, onResume, onAudioChange) {
      if (!YT) return;
      try { if (YT.system && YT.system.onPause) YT.system.onPause(onPause); } catch (e) {}
      try { if (YT.system && YT.system.onResume) YT.system.onResume(onResume); } catch (e) {}
      try {
        if (YT.system && typeof YT.system.isAudioEnabled === 'function') {
          this.audioAllowed = !!YT.system.isAudioEnabled();
        }
        if (YT.system && YT.system.onAudioEnabledChange) {
          YT.system.onAudioEnabledChange(function (on) { Platform.audioAllowed = !!on; onAudioChange(); });
        }
      } catch (e) {}
    },
    firstFrame: function () {
      if (this._firstFrameSent) return;
      this._firstFrameSent = true;
      try { if (YT && YT.game && YT.game.firstFrameReady) YT.game.firstFrameReady(); } catch (e) {}
    },
    ready: function () {
      if (this._readySent) return;
      this._readySent = true;
      try { if (YT && YT.game && YT.game.gameReady) YT.game.gameReady(); } catch (e) {}
    }
  };

  /* =========================================================================
     2. STORAGE
     ========================================================================= */
  var SAVE_KEY = 'thermal.v1';

  var Store = {
    data: {
      bests: { cruise: 0, drive: 0, redline: 0 },
      bestDist: { cruise: 0, drive: 0, redline: 0 },
      bestClimbs: { cruise: 0, drive: 0, redline: 0 },
      tier: 'drive', runs: 0, muted: false,
      quickDeaths: 0, offeredDown: false, offeredUp: false
    },
    best: function (id) { return Store.data.bests[id || Store.data.tier] || 0; },
    dist: function (id) { return Store.data.bestDist[id || Store.data.tier] || 0; },
    climbs: function (id) { return Store.data.bestClimbs[id || Store.data.tier] || 0; },

    load: function (done) {
      var IDS = ['cruise', 'drive', 'redline'];
      var copyNums = function (src, dst) {
        if (!src) return;
        IDS.forEach(function (k) { if (typeof src[k] === 'number') dst[k] = src[k]; });
      };
      var finish = function (obj) {
        if (obj && typeof obj === 'object') {
          copyNums(obj.bests, Store.data.bests);
          copyNums(obj.bestDist, Store.data.bestDist);
          copyNums(obj.bestClimbs, Store.data.bestClimbs);
          if (typeof obj.tier === 'string' && tierById(obj.tier).id === obj.tier) Store.data.tier = obj.tier;
          if (typeof obj.runs === 'number') Store.data.runs = obj.runs;
          if (typeof obj.muted === 'boolean') Store.data.muted = obj.muted;
          if (typeof obj.quickDeaths === 'number') Store.data.quickDeaths = obj.quickDeaths;
          if (typeof obj.offeredDown === 'boolean') Store.data.offeredDown = obj.offeredDown;
          if (typeof obj.offeredUp === 'boolean') Store.data.offeredUp = obj.offeredUp;
        }
        done();
      };
      if (YT && YT.game && YT.game.loadData) {
        var settled = false;
        var timer = setTimeout(function () { if (!settled) { settled = true; finish(null); } }, 2500);
        try {
          YT.game.loadData().then(function (raw) {
            if (settled) return; settled = true; clearTimeout(timer);
            var o = null; try { o = JSON.parse(raw || '{}'); } catch (e) {}
            finish(o);
          })['catch'](function () {
            if (settled) return; settled = true; clearTimeout(timer); finish(null);
          });
          return;
        } catch (e) { if (!settled) { settled = true; clearTimeout(timer); } }
      }
      var local = null;
      try { local = JSON.parse(window.localStorage.getItem(SAVE_KEY) || '{}'); } catch (e) {}
      finish(local);
    },

    save: function () {
      var raw = JSON.stringify(Store.data);
      if (YT && YT.game && YT.game.saveData) {
        try { YT.game.saveData(raw)['catch'](function () {}); return; } catch (e) {}
      }
      try { window.localStorage.setItem(SAVE_KEY, raw); } catch (e) {}
    }
  };


  /* =========================================================================
     3. AUDIO — wind and a variometer. No files.

     The vario is the real instrument: a glider's climb indicator beeps faster
     and higher the harder you are going up, and moans on one low note when you
     are going down. It is the whole game as a sound, and it means a player can
     find lift with their eyes shut.
     ========================================================================= */
  var Sound = {
    ctx: null, master: null, noiseBuf: null,
    started: false, muted: false,
    windSrc: null, windFilt: null, windGain: null,
    varOsc: null, varGain: null, varNext: 0, varOn: false,

    boot: function () {
      if (this.ctx) return;
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { this.ctx = new AC(); } catch (e) { return; }
      var ctx = this.ctx;
      this.master = ctx.createGain();
      this.master.gain.value = 0;
      this.master.connect(ctx.destination);

      var len = Math.floor(ctx.sampleRate * 2.0);
      var buf = ctx.createBuffer(1, len, ctx.sampleRate);
      var ch = buf.getChannelData(0);
      for (var i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
      this.noiseBuf = buf;

      // Wind: one looping noise source, filtered by airspeed, alive for the
      // whole session. Starting and stopping noise sources per frame clicks.
      var s = ctx.createBufferSource();
      s.buffer = buf; s.loop = true;
      var f = ctx.createBiquadFilter(); f.type = 'bandpass';
      f.frequency.value = 500; f.Q.value = 0.7;
      var g = ctx.createGain(); g.gain.value = 0;
      s.connect(f); f.connect(g); g.connect(this.master);
      s.start(0);
      this.windSrc = s; this.windFilt = f; this.windGain = g;

      // Vario: one oscillator, gated.
      var o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = 500;
      var vg = ctx.createGain(); vg.gain.value = 0;
      o.connect(vg); vg.connect(this.master); o.start(0);
      this.varOsc = o; this.varGain = vg;

      this.started = true;
      this.applyVolume();
    },

    resumeCtx: function () {
      if (this.ctx && this.ctx.state === 'suspended') { try { this.ctx.resume(); } catch (e) {} }
    },
    applyVolume: function () {
      if (!this.master) return;
      var on = !this.muted && Platform.audioAllowed;
      try { this.master.gain.setTargetAtTime(on ? 0.85 : 0.0, this.ctx.currentTime, 0.02); } catch (e) {}
    },
    hardStop: function () {
      if (!this.master) return;
      try {
        this.master.gain.setValueAtTime(0, this.ctx.currentTime);
        this.windGain.gain.setValueAtTime(0, this.ctx.currentTime);
        this.varGain.gain.setValueAtTime(0, this.ctx.currentTime);
      } catch (e) {}
    },

    // Called every frame while flying. speed 0..1, climb in altitude units/sec.
    fly: function (speed01, climb, dt) {
      if (!this.started) return;
      var ctx = this.ctx, t = ctx.currentTime;
      try {
        this.windFilt.frequency.setTargetAtTime(340 + speed01 * 1500, t, 0.08);
        this.windGain.gain.setTargetAtTime(0.035 + speed01 * 0.13, t, 0.08);
      } catch (e) {}

      // Beeping above, a steady moan below, silence in the dead band.
      if (climb > 12) {
        var f = 440 + Math.min(climb, 220) * 3.1;
        var period = Math.max(0.08, 0.46 - Math.min(climb, 220) * 0.0016);
        this.varNext -= dt;
        if (this.varNext <= 0) {
          this.varNext = period;
          try {
            this.varGain.gain.cancelScheduledValues(t);
            this.varOsc.frequency.setValueAtTime(f, t);
            this.varGain.gain.setValueAtTime(0.0001, t);
            this.varGain.gain.linearRampToValueAtTime(0.085, t + 0.012);
            this.varGain.gain.exponentialRampToValueAtTime(0.0001, t + period * 0.62);
          } catch (e) {}
        }
      } else if (climb < -55) {
        this.varNext = 0;
        try {
          this.varOsc.frequency.setTargetAtTime(290 + Math.max(-160, climb) * 0.55, t, 0.1);
          this.varGain.gain.setTargetAtTime(0.045, t, 0.12);
        } catch (e) {}
      } else {
        this.varNext = 0;
        try { this.varGain.gain.setTargetAtTime(0.0, t, 0.08); } catch (e) {}
      }
    },

    quiet: function () {
      if (!this.started) return;
      var t = this.ctx.currentTime;
      try {
        this.windGain.gain.setTargetAtTime(0, t, 0.05);
        this.varGain.gain.setTargetAtTime(0, t, 0.05);
      } catch (e) {}
    },

    blip: function (freq, dur, type, vol, delay) {
      if (!this.started) return null;
      var ctx = this.ctx, t = ctx.currentTime + (delay || 0);
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol == null ? 0.2 : vol, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.03);
      return o;
    },

    ui: function () { this.blip(523.25, 0.09, 'triangle', 0.12); },

    // Entering a street: a warm chord swelling up under you.
    street: function () {
      var N = [261.63, 329.63, 392.00];
      for (var i = 0; i < N.length; i++) this.blip(N[i], 0.55, 'sine', 0.11, i * 0.045);
    },

    cloudBase: function () {
      var N = [659.25, 880.00, 1174.66, 1567.98];
      for (var i = 0; i < N.length; i++) this.blip(N[i], 0.5, 'sine', 0.15, i * 0.06);
    },

    swiftGained: function () {
      var N = [523.25, 659.25, 783.99, 1046.50];
      for (var i = 0; i < N.length; i++) this.blip(N[i], 0.4, 'triangle', 0.16, i * 0.07);
    },

    ground: function () {
      if (!this.started) return;
      var ctx = this.ctx, t = ctx.currentTime;
      this.blip(98, 0.6, 'sine', 0.3);
      var s = ctx.createBufferSource(); s.buffer = this.noiseBuf;
      var f = ctx.createBiquadFilter(); f.type = 'lowpass';
      f.frequency.setValueAtTime(1400, t);
      f.frequency.exponentialRampToValueAtTime(150, t + 0.45);
      var g = ctx.createGain();
      g.gain.setValueAtTime(0.26, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
      s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t + 0.55);
    },

    carried: function () {
      var N = [392.00, 493.88, 587.33];
      for (var i = 0; i < N.length; i++) this.blip(N[i], 0.45, 'sine', 0.13, i * 0.1);
    },

    over: function () {
      this.quiet();
      this.blip(329.63, 0.9, 'sine', 0.2);
      this.blip(246.94, 1.1, 'sine', 0.19, 0.1);
      this.blip(164.81, 1.4, 'sine', 0.17, 0.24);
    }
  };

  /* =========================================================================
     4. TUNING

     The flight model is the small honest one: total energy is height plus
     speed, and the stick trades between them. Holding pitches down — you gain
     speed and lose height. Letting go pitches up — you give speed back and get
     height. Drag takes a cut both ways, and it takes a much bigger cut the
     faster you go, which is what makes the whole game a choice about speed.
     ========================================================================= */
  var LOGICAL_H = 960;
  var GROUND_Y  = 862;      // screen y of altitude zero
  var PIX_ALT   = 0.82;     // screen pixels per altitude unit
  var ALT_MAX   = 820;      // cloud base — you cannot climb through it
  var CLOUD_Y   = GROUND_Y - ALT_MAX * PIX_ALT;

  var V_SLOW    = 210;      // airspeed with the wings out
  var V_FAST    = 470;      // airspeed tucked
  var V_RATE    = 1.35;     // how fast the speed follows the wings
  var G_EX      = 900;      // height/speed exchange constant
  var SINK0     = 44;       // still-air sink at V_SLOW, altitude units per second
  var SAVE_ALT  = 430;      // where a companion puts you back after a landing
  var CARRY_T   = 1.15;
  var EDGE      = 120;      // how far a street's lift reaches past its ends
  var START_X   = 420;
  var MAP_RANGE = 5600;     // how far ahead the strip at the bottom looks

  /* -------------------------------------------------------------------------
     THE DAY. A flight is one soarable day, and the sun crossing the sky is the
     clock — no separate timer needed.

     This is the change that made the game a game. Without a clock the score is
     distance and the objective is distance per unit HEIGHT, and the answer to
     that is always "fly slowly": an offline model of the flight physics put
     the best possible speed-to-fly policy just 2-4% ahead of never touching
     the button at all, however the polar was tuned. A strategy worth 3% is not
     a strategy.

     With a clock the objective becomes distance per unit TIME, which is what
     speed-to-fly theory is actually about, and the same model puts a pilot who
     reads the air about 20% ahead of one who never tucks and several times
     ahead of one who never lets go. The button matters because the day ends.

     Lift fades through the last quarter of the afternoon, the way a real day
     dies, so the end of a flight is a scramble rather than a cut. */
  var DAY_LEN   = 150;      // seconds of soarable day
  var DAY_FADE  = 0.26;     // the last quarter, lift dying away

  /* The exponent of the polar, and the single most consequential number here.
     It sets the crossover — the strength of sinking air at which tucking beats
     gliding — via

         210/(44 - a)  vs  470/(sink(470) - a)

     At 1.95 the crossover sits near -16, so tucking is right over most of the
     air between the clouds, and letting go is what you do when you find lift.
     That is also what a real pilot does, and the reason is the same one this
     game now has: the clock. See DAY_LEN. */
  var POLAR_N = 1.95;

  /* -------------------------------------------------------------------------
     The polar: sink against airspeed. Real glider polars are roughly cubic and
     this one is close enough to behave like the real thing — most importantly,
     the best distance-per-height is at the SLOW end in still air, and moves to
     the fast end once the air itself is going down about 60 units a second.
     Flying fast through sinking air and slow through rising air is the actual
     technique real pilots use, and here it is also the whole strategy.
     ------------------------------------------------------------------------- */
  function sinkAt(v) {
    return SINK0 * (0.56 + 0.44 * Math.pow(v / V_SLOW, POLAR_N));
  }

  /* -------------------------------------------------------------------------
     Difficulty is one measured number: SLACK — how far you can glide from
     cloud base compared with how far it is to the next street of lift.

         slack = ALT_MAX x (V_SLOW / SINK0) / gap

     At slack 2.3 you can waste a whole glide and still arrive. At 1.2 you have
     to leave every street near the top and fly the gap properly. Nothing about
     the control changes between tiers — same hold, same two speeds, same
     response — and the only thing that moves is the air.
     ------------------------------------------------------------------------- */
  var TIERS = [
    { id: 'cruise', name: 'Cruise', blurb: 'Room to miss',
      gap: 1500, gapGrow: 0.017, streetLen: 1150, lenShrink: 0.010,
      lift: 150, liftFade: 0.010, amb: -8, hills: 92,
      swifts: 4, maxSwifts: 6, scoreMul: 0.7 },
    { id: 'drive', name: 'Drive', blurb: 'The real thing',
      gap: 1980, gapGrow: 0.021, streetLen: 950, lenShrink: 0.013,
      lift: 165, liftFade: 0.013, amb: -12, hills: 140,
      swifts: 3, maxSwifts: 5, scoreMul: 1.0 },
    { id: 'redline', name: 'Redline', blurb: 'Work every one',
      gap: 2350, gapGrow: 0.025, streetLen: 800, lenShrink: 0.016,
      lift: 180, liftFade: 0.016, amb: -16, hills: 190,
      swifts: 2, maxSwifts: 4, scoreMul: 1.45 }
  ];

  function slackOf(T) { return ALT_MAX * (V_SLOW / SINK0) / T.gap; }

  function tierById(id) {
    for (var i = 0; i < TIERS.length; i++) if (TIERS[i].id === id) return TIERS[i];
    return TIERS[1];
  }
  function tierIndex(id) {
    for (var i = 0; i < TIERS.length; i++) if (TIERS[i].id === id) return i;
    return 1;
  }

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function fmt(n) { return Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

  function roundRect(c, x, y, w, h, r) {
    r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  /* =========================================================================
     5. THE WORLD — all of it a function of x, so it is infinite and free.
     ========================================================================= */
  function groundAt(x) {
    var T = S.tier, a = T.hills;
    return 34 + a * (0.42 * Math.sin(x * 0.00058) +
                     0.34 * Math.sin(x * 0.00137 + 1.7) +
                     0.24 * Math.sin(x * 0.00311 + 0.4)) + a * 0.5;
  }

  /* The air between the streets. A mild average and a deep ripple: the mean is
     what sets the slack, the ripple is what makes every glide a series of
     small decisions about speed.

     The ripple has to be deep to be worth anything. With it at half this
     amplitude, dashing through the worst patch of a glide saved about 19
     altitude units out of 820 — two per cent, which is not a decision, it is a
     rounding error. At this depth the sink reaches about -120, and dashing the
     deep patches is worth something like a fifth of the height band over a
     full glide. Below roughly -60 of air, going fast wins; above it, going
     slow wins. That crossover is the game. */
  function ambientAt(x) {
    return S.tier.amb +
      58 * Math.sin(x * 0.00210 + 1.1) +
      34 * Math.sin(x * 0.00530 + 2.6) -
      18 * Math.sin(x * 0.00091);
  }

  /* Streets of lift, marked by a row of cumulus at cloud base — which is how
     you find them in a real glider, and how you find them here. */
  function extendStreets(toX) {
    var T = S.tier;
    while (!S.streets.length || S.streets[S.streets.length - 1].x1 < toX) {
      var i = S.streets.length ? S.streets[S.streets.length - 1].i + 1 : 0;
      var prevEnd = S.streets.length ? S.streets[S.streets.length - 1].x1 : START_X - T.gap;
      var gap = T.gap * (1 + Math.min(0.55, i * T.gapGrow));
      var len = T.streetLen * (1 - Math.min(0.35, i * T.lenShrink));
      var x0 = prevEnd + gap;
      S.streets.push({
        i: i, x0: x0, x1: x0 + len,
        lift: T.lift * (1 - Math.min(0.30, i * T.liftFade)) * rnd(0.93, 1.09),
        topped: false
      });
    }
    while (S.streets.length > 2 && S.streets[1].x1 < S.x - 2600) S.streets.shift();
  }

  /* How much of the day's lift is left. Full strength until the last quarter,
     then dying away to almost nothing by sundown. */
  function dayLift() {
    var left = 1 - S.dayT / DAY_LEN;
    if (left >= DAY_FADE) return 1;
    return Math.max(0.12, left / DAY_FADE);
  }

  function streetLiftAt(x) {
    var w = 0, fade = dayLift();
    for (var i = 0; i < S.streets.length; i++) {
      var s = S.streets[i];
      if (x < s.x0 - EDGE || x > s.x1 + EDGE) continue;
      var k = 1;
      if (x < s.x0) { k = Math.cos((s.x0 - x) / EDGE * Math.PI / 2); k *= k; }
      else if (x > s.x1) { k = Math.cos((x - s.x1) / EDGE * Math.PI / 2); k *= k; }
      w += s.lift * k * fade;
    }
    return w;
  }

  function airAt(x) { return ambientAt(x) + streetLiftAt(x); }

  function streetAt(x) {
    for (var i = 0; i < S.streets.length; i++) {
      var s = S.streets[i];
      if (x >= s.x0 - EDGE * 0.5 && x <= s.x1 + EDGE * 0.5) return s;
    }
    return null;
  }

  /* =========================================================================
     6. VIEW / SPRITE CACHE
     ========================================================================= */
  var app = document.getElementById('app');
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d', { alpha: false });

  var view = { w: 540, h: LOGICAL_H, scale: 1, dpr: 1 };
  var sprites = {};
  var spriteQ = 2;
  var bgFull = null;

  function sprite(key, w, h, paint) {
    var k = key + '|' + Math.round(w) + 'x' + Math.round(h) + '@' + spriteQ;
    var hit = sprites[k];
    if (hit) return hit;
    var cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.ceil(w * spriteQ));
    cv.height = Math.max(1, Math.ceil(h * spriteQ));
    var c2 = cv.getContext('2d');
    c2.setTransform(spriteQ, 0, 0, spriteQ, 0, 0);
    paint(c2, w, h);
    hit = { cv: cv, w: w, h: h };
    sprites[k] = hit;
    return hit;
  }

  function blit(s, cx, cy) { ctx.drawImage(s.cv, cx - s.w / 2, cy - s.h / 2, s.w, s.h); }

  function layout() {
    var cw = Math.max(1, app.clientWidth || window.innerWidth);
    var chh = Math.max(1, app.clientHeight || window.innerHeight);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);

    // Past this many device pixels, drop resolution rather than frames.
    var budget = 2.6e6;
    var pxCount = cw * chh * dpr * dpr;
    if (pxCount > budget) dpr = Math.max(1, dpr * Math.sqrt(budget / pxCount));

    canvas.width = Math.round(cw * dpr);
    canvas.height = Math.round(chh * dpr);
    canvas.style.width = cw + 'px';
    canvas.style.height = chh + 'px';

    view.dpr = dpr;
    view.scale = chh / LOGICAL_H;
    view.h = LOGICAL_H;
    view.w = cw / view.scale;

    ctx.setTransform(dpr * view.scale, 0, 0, dpr * view.scale, 0, 0);
    spriteQ = clamp(view.scale * view.dpr, 1, 2.5);
    sprites = {};
    bgFull = null;
  }

  function birdScreenX() { return clamp(view.w * 0.30, 120, 300); }
  function altY(alt) { return GROUND_Y - alt * PIX_ALT; }

  /* -------------------------------------------------------------------------
     Sky and haze never change, so they are painted once per layout at real
     canvas resolution and blitted 1:1. Stretching a small texture over the
     screen every frame costs per destination pixel, and that alone was the
     30-versus-60 fps gap in an earlier game in this portfolio.
     ------------------------------------------------------------------------- */
  function backgroundFull() {
    if (bgFull && bgFull.width === canvas.width && bgFull.height === canvas.height) return bgFull;
    var cv = document.createElement('canvas');
    cv.width = Math.max(1, canvas.width);
    cv.height = Math.max(1, canvas.height);
    var c = cv.getContext('2d');
    c.setTransform(view.dpr * view.scale, 0, 0, view.dpr * view.scale, 0, 0);

    var W = view.w, H = view.h;
    var sky = c.createLinearGradient(0, 0, 0, GROUND_Y + 10);
    sky.addColorStop(0, '#2f9fdc');
    sky.addColorStop(0.34, '#62bde8');
    sky.addColorStop(0.74, '#a8dcf2');
    sky.addColorStop(1, '#dff2fb');
    c.fillStyle = sky;
    c.fillRect(0, 0, W, GROUND_Y + 10);

    // High cirrus above the working layer. Baked, so it costs nothing, and it
    // stops the top fifth of the screen being a flat sheet of blue.
    c.fillStyle = 'rgba(255,255,255,.26)';
    for (var ci = 0; ci < 9; ci++) {
      var cxp = (ci * 271) % (W + 200) - 100;
      var cyp = 46 + ((ci * 53) % 92);
      var cwp = 130 + (ci % 4) * 78;
      roundRect(c, cxp, cyp, cwp, 7 + (ci % 3) * 3, 6); c.fill();
      roundRect(c, cxp + cwp * 0.22, cyp + 15, cwp * 0.55, 5, 4); c.fill();
    }

    // Distant haze layer above the ground, so the world has depth even where
    // nothing is moving.
    var haze = c.createLinearGradient(0, GROUND_Y - 230, 0, GROUND_Y + 8);
    haze.addColorStop(0, 'rgba(222,244,252,0)');
    haze.addColorStop(1, 'rgba(226,244,251,.85)');
    c.fillStyle = haze;
    c.fillRect(0, GROUND_Y - 230, W, 240);

    // Below the ground line: the instrument strip's ground.
    c.fillStyle = '#0f5d7e';
    c.fillRect(0, GROUND_Y + 8, W, H - GROUND_Y);

    bgFull = cv;
    return cv;
  }

  /* =========================================================================
     7. RUN STATE
     ========================================================================= */
  var S = {
    mode: 'menu', resumeMode: 'play', tier: TIERS[1],

    x: 0, alt: 480, v: V_SLOW, held: false, pitch: 0, dayT: 0,
    climb: 0, climbSm: 0, airHere: 0, airSm: 0,
    streets: [],

    swifts: 3, maxSwifts: 5, swiftsWon: 0, topped: 0,
    landings: 0, score: 0, bestAlt: 0, longest: 0, glideFrom: 0,

    carry: 0, carryFrom: 0,
    trail: [], particles: [], floats: [],
    shake: 0, flash: 0, flashCol: '255,255,255',
    toastT: 0, toastMsg: '', toastSub: '',
    deathT: 0, time: 0, wing: 0
  };

  var overTitleText = 'Grounded';

  function resetRun() {
    var T = tierById(Store.data.tier);
    S.tier = T;
    S.mode = 'menu';
    S.x = 0; S.alt = 480; S.v = V_SLOW; S.held = false; S.pitch = 0; S.dayT = 0;
    S.climb = 0; S.climbSm = 0; S.airHere = 0; S.airSm = 0;
    S.streets.length = 0;
    S.swifts = T.swifts; S.maxSwifts = T.maxSwifts; S.swiftsWon = 0; S.topped = 0;
    S.landings = 0; S.score = 0; S.bestAlt = 480; S.longest = 0; S.glideFrom = 0;
    S.carry = 0;
    S.trail.length = 0; S.particles.length = 0; S.floats.length = 0;
    S.shake = 0; S.flash = 0;
    S.toastT = 0; S.deathT = 0; S.time = 0; S.wing = 0;
    extendStreets(START_X + 9000);
  }

  function toast(msg, sub) { S.toastMsg = msg; S.toastSub = sub || ''; S.toastT = 2.4; }

  function floatText(x, y, text, col, size) {
    S.floats.push({ x: x, y: y, text: text, col: col, size: size || 28, life: 1.3, max: 1.3 });
  }

  function burst(sx, sy, col, n, spread, speed, up) {
    for (var i = 0; i < n; i++) {
      var a = rnd(0, Math.PI * 2), sp = rnd(speed * 0.35, speed);
      S.particles.push({
        x: sx + rnd(-spread, spread), y: sy + rnd(-spread, spread),
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (up || 0),
        life: rnd(0.4, 0.95), max: 0.95, r: rnd(2.4, 6), col: col, g: up ? -140 : 620
      });
    }
  }

  /* =========================================================================
     8. FLIGHT
     ========================================================================= */
  function topOut(st) {
    st.topped = true;
    S.topped++;
    var bonus = Math.round(300 * S.tier.scoreMul);
    Sound.cloudBase();
    floatText(birdScreenX(), altY(ALT_MAX) + 58, 'CLOUD BASE  +' + bonus, '#0f6ea8', 26);
    burst(birdScreenX(), altY(ALT_MAX) + 20, '#ffffff', 20, 26, 190, 90);
    if (S.swifts < S.maxSwifts) {
      S.swifts++; S.swiftsWon++;
      Sound.swiftGained();
      floatText(birdScreenX(), altY(ALT_MAX) + 110, 'A SWIFT JOINS YOU', '#e2703a', 22);
    }
  }

  /* A landing is not the end. A companion goes under you and carries you back
     up to a working height, and then it is gone. The flock is the life bar, and
     the only way to grow it is to top a street out — so you cannot play safe
     into safety. */
  function land() {
    S.landings++;
    S.swifts--;
    S.shake = 17;
    S.flash = 0.45; S.flashCol = '255,214,140';
    Sound.ground();
    burst(birdScreenX(), altY(groundAt(S.x)), '#cbe88f', 26, 20, 340);
    var run = S.x - S.glideFrom;
    if (run > S.longest) S.longest = run;
    if (S.swifts <= 0) { gameOver('Grounded'); return; }
    S.carry = CARRY_T;
    S.carryFrom = S.alt;
    S.v = V_SLOW;
    S.held = false;
    Sound.carried();
    floatText(birdScreenX(), altY(SAVE_ALT) - 40, S.swifts + ' LEFT', '#e2703a', 24);
  }

  function gameOver(title) {
    overTitleText = title || 'Grounded';
    S.mode = 'dead';
    S.deathT = 1.3;
    Sound.quiet();
    Sound.over();
  }

  function update(dt) {
    updateFx(dt);

    if (S.mode === 'dead') {
      S.deathT -= dt;
      if (S.deathT <= 0 && !gameOverShown) showGameOver();
      return;
    }
    if (S.mode !== 'play') return;

    S.time += dt;
    S.dayT += dt;
    if (S.dayT >= DAY_LEN) {
      var runEnd = S.x - S.glideFrom;
      if (runEnd > S.longest) S.longest = runEnd;
      gameOver('Sundown');
      return;
    }
    extendStreets(S.x + view.w / 1 + 9000);

    if (S.carry > 0) {
      S.carry -= dt;
      var k = clamp(1 - S.carry / CARRY_T, 0, 1);
      S.alt = lerp(S.carryFrom, SAVE_ALT, k * k * (3 - 2 * k));
      S.x += V_SLOW * 0.55 * dt;
      S.climbSm = lerp(S.climbSm, 120, dt * 4);
      S.airSm = lerp(S.airSm, 0, dt * 4);
      if (S.carry <= 0) { S.glideFrom = S.x; S.carry = 0; }
      return;
    }

    // Wings: held is tucked, released is out. One button, two airspeeds, and
    // the response is byte-identical on every tier.
    var target = S.held ? V_FAST : V_SLOW;
    var dv = (target - S.v) * V_RATE * dt;
    S.v += dv;

    // Height and speed are the same thing in two pockets. Moving speed into
    // one pocket takes it out of the other.
    S.alt += -(S.v * dv) / G_EX;

    var air = airAt(S.x);
    var rate = air - sinkAt(S.v);
    S.airHere = air;
    S.climb = rate;
    S.climbSm = lerp(S.climbSm, rate, Math.min(1, dt * 7));
    S.airSm = lerp(S.airSm, air, Math.min(1, dt * 7));

    S.alt += rate * dt;
    S.x += S.v * dt;

    S.pitch = lerp(S.pitch, S.held ? 1 : (rate > 20 ? -0.45 : -0.1), Math.min(1, dt * 7));
    S.wing += dt * (S.held ? 3 : 8);

    if (S.alt > S.bestAlt) S.bestAlt = S.alt;

    if (S.alt >= ALT_MAX) {
      S.alt = ALT_MAX;
      var st = streetAt(S.x);
      if (st && !st.topped) topOut(st);
    }

    var g = groundAt(S.x);
    if (S.alt <= g + 8) { S.alt = g + 8; land(); return; }

    // A run of lift entered for the first time is worth announcing — it is the
    // only thing on screen you actively look for.
    var here = streetAt(S.x);
    if (here && here !== S.lastStreet) {
      S.lastStreet = here;
      if (S.alt < ALT_MAX - 30) Sound.street();
      var run2 = S.x - S.glideFrom;
      if (run2 > S.longest) S.longest = run2;
      S.glideFrom = S.x;
    } else if (!here) {
      S.lastStreet = null;
    }

    S.score = Math.floor((S.x / 10 + 300 * S.topped) * S.tier.scoreMul);

    if (S.trailT == null) S.trailT = 0;
    S.trailT -= dt;
    if (S.trailT <= 0) {
      S.trailT = 0.045;
      S.trail.push({ x: S.x, alt: S.alt, up: rate > 12 });
      if (S.trail.length > 46) S.trail.shift();
    }

    Sound.fly(clamp((S.v - V_SLOW) / (V_FAST - V_SLOW), 0, 1), air - SINK0, dt);
  }

  /* Screen effects decay on real time and in every mode, so a run that ends on
     a flash does not leave the flash painted on forever. That bug shipped once
     in this portfolio; it does not ship again. */
  function updateFx(dt) {
    S.shake *= Math.pow(0.0016, dt);
    if (S.shake < 0.05) S.shake = 0;
    S.flash = Math.max(0, S.flash - dt * 2.1);
    if (S.toastT > 0) S.toastT -= dt;

    var i;
    for (i = S.particles.length - 1; i >= 0; i--) {
      var p = S.particles[i];
      p.life -= dt;
      if (p.life <= 0) { S.particles.splice(i, 1); continue; }
      p.vy += p.g * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    for (i = S.floats.length - 1; i >= 0; i--) {
      var f = S.floats[i];
      f.life -= dt;
      if (f.life <= 0) { S.floats.splice(i, 1); continue; }
      f.y -= 46 * dt;
    }
  }

  /* Where you would land if the air did nothing from here — which is what the
     instrument in a real glider tells you, and what the dashed line on screen
     is. It deliberately knows nothing about the air ahead: reading the air is
     the player's job, and the sky is painted so they can. */
  function glideReach() {
    var ratio = S.v / sinkAt(S.v);
    var x = S.x, a = S.alt;
    for (var i = 0; i < 110; i++) {
      a -= 60 / ratio;
      x += 60;
      if (a <= groundAt(x)) return { x: x, alt: Math.max(a, groundAt(x)), hit: true };
    }
    return { x: x, alt: a, hit: false };
  }

  /* =========================================================================
     9. INPUT — hold anywhere. Identical on every tier.
     ========================================================================= */
  function press() {
    if (S.mode !== 'play' || S.carry > 0) return;
    Sound.resumeCtx();
    S.held = true;
  }
  function release() { S.held = false; }

  app.addEventListener('pointerdown', function (e) {
    if (e.target && e.target.closest && e.target.closest('#sysbar')) return;
    e.preventDefault();
    Sound.boot();
    press();
  }, { passive: false });
  app.addEventListener('pointerup', function () { release(); });
  app.addEventListener('pointercancel', function () { release(); });
  app.addEventListener('pointerleave', function () { release(); });
  window.addEventListener('blur', function () { release(); });

  document.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'Escape' || k === 'p' || k === 'P') {
      e.preventDefault();
      if (S.mode === 'play') pauseGame(); else if (S.mode === 'paused') resumeGame();
      return;
    }
    if (k === 'm' || k === 'M') { e.preventDefault(); Sound.boot(); Sound.resumeCtx(); toggleMute(); return; }
    if (k === ' ' || k === 'Spacebar' || k === 'Enter' || k === 'ArrowDown' || k === 's' || k === 'S') {
      if (S.mode !== 'play') return;
      e.preventDefault();
      if (e.repeat) return;
      Sound.boot();
      press();
    }
  });
  document.addEventListener('keyup', function (e) {
    var k = e.key;
    if (k === ' ' || k === 'Spacebar' || k === 'Enter' || k === 'ArrowDown' || k === 's' || k === 'S') release();
  });

  /* =========================================================================
     10. RENDER
     ========================================================================= */
  var BAND = 54;              // width of one painted column of air
  var camX = 0;

  function render() {
    camX = S.x - birdScreenX();

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(backgroundFull(), 0, 0);
    ctx.restore();

    var sx = 0, sy = 0;
    if (S.shake > 0.1) { sx = rnd(-S.shake, S.shake); sy = rnd(-S.shake * 0.6, S.shake * 0.6); }
    ctx.save();
    ctx.translate(sx, sy);

    drawAir();
    drawClouds();
    drawTerrain();
    drawGlideCone();
    drawTrail();
    drawFlock();
    drawBird();
    drawParticles();

    ctx.restore();

    drawSky();
    drawVario();
    drawStrip();
    drawHud();
    drawFloats();
    drawToast();

    if (S.flash > 0.001) {
      ctx.fillStyle = 'rgba(' + S.flashCol + ',' + (S.flash * 0.45).toFixed(3) + ')';
      ctx.fillRect(0, 0, view.w, view.h);
    }
  }

  /* -------------------------------------------------------------------------
     The air, painted. Warm chevrons rising where the air rises, cool ones
     falling where it falls, brighter the stronger it is. This is the readout
     and it is also the rule: there is nothing about the air that the sky does
     not already tell you.
     ------------------------------------------------------------------------- */
  function chevron(up, strong) {
    var key = 'chev|' + (up ? 'u' : 'd') + (strong ? 's' : 'w');
    return sprite(key, 26, 16, function (c, w, h) {
      c.strokeStyle = up ? (strong ? '#ff8f28' : '#ffc271') : (strong ? '#4d6fb4' : '#8fa6d6');
      c.lineWidth = strong ? 5 : 3.6;
      c.lineCap = 'round'; c.lineJoin = 'round';
      c.beginPath();
      if (up) { c.moveTo(3, h - 3); c.lineTo(w / 2, 3); c.lineTo(w - 3, h - 3); }
      else { c.moveTo(3, 3); c.lineTo(w / 2, h - 3); c.lineTo(w - 3, 3); }
      c.stroke();
    });
  }

  function drawAir() {
    var x0 = Math.floor(camX / BAND) * BAND;
    var x1 = camX + view.w + BAND;
    for (var wx = x0; wx < x1; wx += BAND) {
      var mid = wx + BAND / 2;
      var w = airAt(mid);
      var mag = Math.abs(w);
      if (mag < 6) continue;
      var up = w > 0;
      var strong = mag > 62;
      var a = Math.min(0.40, mag / 250);
      var px = wx - camX;
      var top = CLOUD_Y + 6;
      var bot = altY(groundAt(mid)) - 4;
      if (bot <= top) continue;

      // No gap between bands: adjacent columns have to merge into one region
      // of warm or cool air. With an inset they read as a barcode instead.
      ctx.globalAlpha = a * 0.62;
      ctx.fillStyle = up ? '#ff9b1e' : '#4f72bd';
      ctx.fillRect(px, top, BAND + 1.2, bot - top);

      // Two chevrons per column, drifting at the speed of the air itself.
      ctx.globalAlpha = Math.min(0.9, a * 2.4);
      var span = bot - top;
      var drift = (S.time * w * 0.42) % span;
      for (var k = 0; k < 2; k++) {
        var y = top + (((k * span / 2) - drift) % span + span) % span;
        blit(chevron(up, strong), px + BAND / 2, y);
      }
    }
    ctx.globalAlpha = 1;
  }

  function cloudSprite(w) {
    return sprite('cloud', w, w * 0.62, function (c, cw, ch) {
      c.fillStyle = '#c9ddea';
      c.beginPath();
      c.ellipse(cw * 0.5, ch * 0.78, cw * 0.46, ch * 0.2, 0, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = '#ffffff';
      var lobes = [[0.28, 0.62, 0.24], [0.52, 0.46, 0.3], [0.74, 0.64, 0.22], [0.42, 0.7, 0.26]];
      for (var i = 0; i < lobes.length; i++) {
        c.beginPath();
        c.arc(cw * lobes[i][0], ch * lobes[i][1], cw * lobes[i][2], 0, Math.PI * 2);
        c.fill();
      }
      c.fillRect(cw * 0.16, ch * 0.7, cw * 0.68, ch * 0.14);
    });
  }

  /* Cumulus sits on top of rising air — in the sky and here. A row of cloud is
     how you spot a street from a long way off, which is the point of it. */
  function drawClouds() {
    ctx.fillStyle = 'rgba(255,255,255,.30)';
    ctx.fillRect(0, CLOUD_Y - 4, view.w, 7);

    for (var i = 0; i < S.streets.length; i++) {
      var st = S.streets[i];
      if (st.x1 - camX < -260 || st.x0 - camX > view.w + 260) continue;
      var step = 168;
      for (var wx = st.x0; wx <= st.x1; wx += step) {
        var size = 150 + ((Math.sin(wx * 0.013) + 1) * 42) * (st.lift / 170);
        ctx.globalAlpha = st.topped ? 0.62 : 1;
        blit(cloudSprite(Math.round(size / 18) * 18), wx - camX, CLOUD_Y + size * 0.10);
        ctx.globalAlpha = 1;
      }
    }
  }

  function drawTerrain() {
    var W = view.w, step = 26;

    // A hazy ridge behind, moving slower, so speed reads even over flat ground.
    ctx.fillStyle = '#a9c7b4';
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y + 40);
    for (var px = 0; px <= W; px += 34) {
      var q = camX * 0.42 + px;
      var yy = altY(126 + S.tier.hills * 0.42 * Math.sin(q * 0.00094) + 40 * Math.sin(q * 0.0026 + 2.1));
      ctx.lineTo(px, yy);
    }
    ctx.lineTo(W, GROUND_Y + 40);
    ctx.closePath();
    ctx.fill();

    // The ground you can hit. Field slabs give it texture and give motion a
    // reference — over featureless green, 430 units a second looks like 210.
    var pts = [];
    for (var sx2 = -step; sx2 <= W + step; sx2 += step) {
      pts.push([sx2, altY(groundAt(camX + sx2))]);
    }
    var bandW = 340;
    var fx0 = Math.floor(camX / bandW) * bandW;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.lineTo(W + step, 894);
    ctx.lineTo(-step, 894);
    ctx.closePath();
    ctx.clip();
    for (var wx = fx0; wx < camX + W + bandW; wx += bandW) {
      var odd = Math.abs(Math.floor(wx / bandW)) % 2;
      ctx.fillStyle = odd ? '#74bb55' : '#84c962';
      ctx.fillRect(wx - camX, 0, bandW, 960);
    }
    ctx.fillStyle = 'rgba(38,86,40,.16)';
    ctx.fillRect(0, 0, W, 960);
    ctx.restore();

    // Sunlit rim along the top edge — and the rim is where the lift comes from.
    ctx.strokeStyle = '#bde890';
    ctx.lineWidth = 6;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var j = 1; j < pts.length; j++) ctx.lineTo(pts[j][0], pts[j][1]);
    ctx.stroke();
  }

  function drawGlideCone() {
    if (S.mode !== 'play' || S.carry > 0) return;
    var r = glideReach();
    var next = null;
    for (var i = 0; i < S.streets.length; i++) {
      if (S.streets[i].x1 > S.x + 40) { next = S.streets[i]; break; }
    }
    var makes = next ? (r.x >= next.x0) : true;

    ctx.save();
    ctx.setLineDash([13, 11]);
    ctx.lineWidth = 4;
    ctx.strokeStyle = makes ? 'rgba(26,120,60,.62)' : 'rgba(200,52,34,.72)';
    ctx.beginPath();
    ctx.moveTo(birdScreenX(), altY(S.alt));
    ctx.lineTo(r.x - camX, altY(r.alt));
    ctx.stroke();
    ctx.setLineDash([]);

    // Where you would touch down. The one number the instrument is for.
    var mx = r.x - camX, my = altY(r.alt);
    ctx.strokeStyle = makes ? 'rgba(26,120,60,.8)' : 'rgba(200,52,34,.9)';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(mx, my, 11, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(mx - 18, my); ctx.lineTo(mx + 18, my); ctx.stroke();
    ctx.restore();
  }

  function drawTrail() {
    for (var i = 0; i < S.trail.length; i++) {
      var t = S.trail[i], k = i / S.trail.length;
      ctx.globalAlpha = k * 0.4;
      ctx.fillStyle = t.up ? '#ff9f3c' : '#ffffff';
      ctx.beginPath();
      ctx.arc(t.x - camX, altY(t.alt), 1.5 + k * 3.4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function swiftSprite(tuck, flap, small) {
    var f = Math.round(flap * 3) / 3;
    var sc = small ? 0.56 : 1;
    return sprite('swift|' + (tuck ? 't' : 'o') + '|' + f + '|' + (small ? 's' : 'b'), 96 * sc, 60 * sc,
      function (c, w, h) {
        var mx = w * 0.46, my = h * 0.5, S1 = w / 96;
        var spread = tuck ? 0.32 : 1;
        var dy = Math.sin(f * Math.PI * 2) * (tuck ? 3 : 9) * S1;

        // Wings first, behind the body. A swift's wing is a scythe, but a thin
        // scythe reads as a spike at flock size, so these are a little fuller
        // than the bird in the field guide.
        c.fillStyle = '#e2703a';
        for (var s = -1; s <= 1; s += 2) {
          c.beginPath();
          c.moveTo(mx + 2 * S1, my - s * 2 * S1);
          c.quadraticCurveTo(
            mx - (10 + 16 * spread) * S1, my + s * (4 + 14 * spread) * S1 + dy * s * 0.5,
            mx - (26 + 26 * spread) * S1, my + s * (12 + 28 * spread) * S1 + dy * s);
          c.lineTo(mx - (30 + 14 * spread) * S1, my + s * (10 + 22 * spread) * S1 + dy * s);
          c.quadraticCurveTo(
            mx - (14 + 6 * spread) * S1, my + s * (7 + 9 * spread) * S1,
            mx - 6 * S1, my + s * 4 * S1);
          c.closePath();
          c.fill();
        }
        // Body.
        c.fillStyle = '#ff8a3d';
        c.beginPath();
        c.moveTo(mx + 30 * S1, my);
        c.quadraticCurveTo(mx + 6 * S1, my - 11 * S1, mx - 26 * S1, my - 5 * S1);
        c.quadraticCurveTo(mx - 34 * S1, my, mx - 26 * S1, my + 5 * S1);
        c.quadraticCurveTo(mx + 6 * S1, my + 11 * S1, mx + 30 * S1, my);
        c.closePath();
        c.fill();
        c.fillStyle = '#fff0dc';
        c.beginPath();
        c.moveTo(mx + 26 * S1, my + 1 * S1);
        c.quadraticCurveTo(mx + 2 * S1, my + 9 * S1, mx - 22 * S1, my + 4 * S1);
        c.quadraticCurveTo(mx + 2 * S1, my + 3 * S1, mx + 26 * S1, my + 1 * S1);
        c.closePath();
        c.fill();
        // Forked tail.
        c.fillStyle = '#c85a26';
        c.beginPath();
        c.moveTo(mx - 24 * S1, my - 4 * S1);
        c.lineTo(mx - 44 * S1, my - 11 * S1);
        c.lineTo(mx - 33 * S1, my);
        c.lineTo(mx - 44 * S1, my + 11 * S1);
        c.lineTo(mx - 24 * S1, my + 4 * S1);
        c.closePath();
        c.fill();
        // Eye.
        c.fillStyle = '#2a1508';
        c.beginPath(); c.arc(mx + 17 * S1, my - 2.6 * S1, 2.6 * S1, 0, Math.PI * 2); c.fill();
      });
  }

  function birdAngle() {
    var a = -Math.atan2(S.climbSm, Math.max(60, S.v));
    return clamp(a * 0.85 + S.pitch * 0.12, -0.6, 0.85);
  }

  function drawBird() {
    var bx = birdScreenX(), by = altY(S.alt);
    ctx.save();
    ctx.translate(bx, by);
    ctx.rotate(birdAngle());
    blit(swiftSprite(S.held, (S.wing % 1), false), 0, 0);
    ctx.restore();

    // A ring while a companion is carrying you back up, so the beat reads.
    if (S.carry > 0) {
      ctx.strokeStyle = 'rgba(255,255,255,.7)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(bx, by, 38 + (1 - S.carry / CARRY_T) * 26, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function drawFlock() {
    var n = Math.max(0, S.swifts - 1);
    for (var i = 0; i < n; i++) {
      var lag = 9 + i * 8;
      var t = S.trail[Math.max(0, S.trail.length - 1 - lag)];
      if (!t) continue;
      var off = (i % 2 ? 1 : -1) * (18 + i * 5);
      ctx.save();
      ctx.translate(t.x - camX - 8, altY(t.alt) + off);
      ctx.rotate(birdAngle() * 0.8);
      ctx.globalAlpha = 0.88;
      blit(swiftSprite(S.held, ((S.wing + i * 0.31) % 1), true), 0, 0);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function drawParticles() {
    for (var i = 0; i < S.particles.length; i++) {
      var p = S.particles[i];
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* =========================================================================
     11. INSTRUMENTS AND HUD
     ========================================================================= */
  var FONT = ' system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';

  function label(text, x, y, size, col, align, stroke) {
    ctx.font = '900 ' + size + 'px' + FONT;
    ctx.textAlign = align || 'center';
    ctx.textBaseline = 'middle';
    if (stroke) {
      ctx.lineJoin = 'round';
      ctx.lineWidth = Math.max(3, size * 0.16);
      ctx.strokeStyle = stroke;
      ctx.strokeText(text, x, y);
    }
    ctx.fillStyle = col;
    ctx.fillText(text, x, y);
  }

  /* The variometer shows THE AIR, not your own climb.

     The first version showed total energy — air minus your own sink — which
     reads beautifully and is quietly circular: diving makes the needle plunge,
     which says "dive harder". The test auto-pilot fell straight into it and
     held the button until it hit the ground. A player would have too.

     So the bar is netto: what the air itself is doing, which is also what the
     sky is painted to show. The tick at +44 is the line where the air is
     rising as fast as the wings are sinking — above it you gain height, below
     it you are trading. One instrument, one rule, and it agrees with the view
     out of the window. */
  var VAR_TOP = 298, VAR_MID = 486, VAR_BOT = 674, VAR_RANGE = 200;

  /* The sun IS the clock. It comes up on the left, crosses, and goes down on
     the right, and when it lands the day is over. The sky warms through the
     last third because that is what tells you to stop climbing and go. */
  function sunSprite() {
    var R = 190;
    return sprite('sun', R * 2, R * 2, function (c, w, h) {
      var g = c.createRadialGradient(w / 2, h / 2, 8, w / 2, h / 2, R);
      g.addColorStop(0, 'rgba(255,255,238,.98)');
      g.addColorStop(0.10, 'rgba(255,252,214,.72)');
      g.addColorStop(0.30, 'rgba(255,242,186,.26)');
      g.addColorStop(1, 'rgba(255,238,180,0)');
      c.fillStyle = g;
      c.fillRect(0, 0, w, h);
      c.fillStyle = '#fffdf0';
      c.beginPath(); c.arc(w / 2, h / 2, 26, 0, Math.PI * 2); c.fill();
    });
  }

  function drawSky() {
    var p = clamp(S.dayT / DAY_LEN, 0, 1);
    var sx = view.w * (0.06 + 0.88 * p);
    var sy = 108 + 210 * Math.pow(Math.abs(2 * p - 1), 1.7);
    blit(sunSprite(), sx, sy);

    var evening = clamp((p - 0.66) / 0.34, 0, 1);
    if (evening > 0.001) {
      ctx.fillStyle = 'rgba(255,146,54,' + (evening * 0.24).toFixed(3) + ')';
      ctx.fillRect(0, 0, view.w, GROUND_Y + 12);
    }

    // A slim bar of the day, in case the sun is behind a cloud.
    var bw = view.w - 48;
    ctx.fillStyle = 'rgba(255,255,255,.32)';
    roundRect(ctx, 24, 9, bw, 5, 3); ctx.fill();
    ctx.fillStyle = evening > 0.3 ? '#e2703a' : '#ffc24d';
    roundRect(ctx, 24, 9, Math.max(3, bw * p), 5, 3); ctx.fill();
  }

  function drawVario() {
    var x = 36;
    ctx.fillStyle = 'rgba(255,255,255,.34)';
    roundRect(ctx, x - 11, VAR_TOP - 10, 22, VAR_BOT - VAR_TOP + 20, 11);
    ctx.fill();

    ctx.strokeStyle = 'rgba(18,52,72,.3)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x - 16, VAR_MID); ctx.lineTo(x + 16, VAR_MID); ctx.stroke();

    var v = clamp(S.airSm, -VAR_RANGE, VAR_RANGE);
    var h = (v / VAR_RANGE) * (VAR_MID - VAR_TOP);
    if (Math.abs(h) > 1) {
      ctx.fillStyle = v > 0 ? '#ff9f3c' : '#5d7cbb';
      roundRect(ctx, x - 8, v > 0 ? VAR_MID - h : VAR_MID, 16, Math.abs(h), 8);
      ctx.fill();
    }

    // The break-even tick: above this line the air is lifting you faster than
    // the wings are letting you down.
    var ty = VAR_MID - (SINK0 / VAR_RANGE) * (VAR_MID - VAR_TOP);
    ctx.strokeStyle = 'rgba(20,90,50,.75)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x - 15, ty); ctx.lineTo(x + 15, ty); ctx.stroke();

    label('AIR', x, VAR_BOT + 26, 10, 'rgba(18,52,72,.6)');
    label(Math.round(S.airSm) > 0 ? '+' + Math.round(S.airSm) : String(Math.round(S.airSm)),
      x, VAR_TOP - 28, 14, v > 0 ? '#c2621a' : '#3d5a94', 'center', 'rgba(255,255,255,.8)');
  }

  /* The strip along the bottom: the ground ahead and the streets on it. A
     phone sees less sky than a desktop, so the strategy would otherwise be
     easier on a big screen. The instrument gives both the same information. */
  function drawStrip() {
    var x0 = 24, x1 = view.w - 24, w = x1 - x0, y0 = 900, h = 48;
    if (w < 120) return;
    var wx0 = S.x - MAP_RANGE * 0.10, k = w / MAP_RANGE;

    ctx.fillStyle = 'rgba(255,255,255,.16)';
    roundRect(ctx, x0, y0, w, h, 10); ctx.fill();

    ctx.save();
    roundRect(ctx, x0, y0, w, h, 10); ctx.clip();

    for (var i = 0; i < S.streets.length; i++) {
      var st = S.streets[i];
      var a = x0 + (st.x0 - wx0) * k, b = x0 + (st.x1 - wx0) * k;
      if (b < x0 || a > x1) continue;
      ctx.fillStyle = st.topped ? 'rgba(255,196,110,.35)' : 'rgba(255,164,58,.72)';
      ctx.fillRect(a, y0, Math.max(2, b - a), h);
    }

    ctx.fillStyle = '#2f7a4a';
    ctx.beginPath();
    ctx.moveTo(x0, y0 + h);
    for (var px = 0; px <= w; px += 6) {
      var g = groundAt(wx0 + px / k);
      ctx.lineTo(x0 + px, y0 + h - 4 - (g / (S.tier.hills * 1.5 + 90)) * (h - 12));
    }
    ctx.lineTo(x1, y0 + h);
    ctx.closePath();
    ctx.fill();

    var bx = x0 + (S.x - wx0) * k;
    ctx.fillStyle = '#ff8a3d';
    ctx.beginPath();
    ctx.moveTo(bx, y0 + 8); ctx.lineTo(bx + 7, y0); ctx.lineTo(bx - 7, y0);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.8)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(bx, y0); ctx.lineTo(bx, y0 + h); ctx.stroke();
    ctx.restore();

    ctx.strokeStyle = 'rgba(255,255,255,.3)';
    ctx.lineWidth = 2;
    roundRect(ctx, x0, y0, w, h, 10); ctx.stroke();
  }

  function swiftPip(filled) {
    return sprite('pip|' + (filled ? 1 : 0), 26, 18, function (c, w, h) {
      c.strokeStyle = filled ? '#c85a26' : 'rgba(18,52,72,.42)';
      c.fillStyle = filled ? '#ff8a3d' : 'rgba(255,255,255,.25)';
      c.lineWidth = 2.2; c.lineJoin = 'round';
      c.beginPath();
      c.moveTo(w * 0.06, h * 0.16);
      c.quadraticCurveTo(w * 0.32, h * 0.52, w * 0.5, h * 0.42);
      c.quadraticCurveTo(w * 0.68, h * 0.52, w * 0.94, h * 0.16);
      c.quadraticCurveTo(w * 0.68, h * 0.92, w * 0.5, h * 0.72);
      c.quadraticCurveTo(w * 0.32, h * 0.92, w * 0.06, h * 0.16);
      c.closePath();
      c.fill();
      c.stroke();
    });
  }

  function drawHud() {
    for (var i = 0; i < S.maxSwifts; i++) blit(swiftPip(i < S.swifts), 36 + i * 27, 40);
    label('FLOCK', 24, 64, 10, 'rgba(18,52,72,.6)', 'left');

    // On a narrow view the flock and the distance are close enough to touch,
    // so the distance shrinks rather than the flock — the flock is a count and
    // has to stay countable.
    var dsz = view.w < 540 ? 33 : 40;
    label(fmt(S.x / 10) + ' m', view.w / 2, 52, dsz, '#123448', 'center', 'rgba(255,255,255,.85)');
    var sub = S.topped + (S.topped === 1 ? ' street topped' : ' streets topped');
    label(sub.toUpperCase(), view.w / 2, 88, 13, '#1a6d96', 'center', 'rgba(255,255,255,.8)');

    // Airspeed, under the flock. It used to live top right, where the row of
    // cumulus that marks a street runs straight over it.
    var sw = 126, sx0 = 24, sy0 = 92;
    ctx.fillStyle = 'rgba(255,255,255,.34)';
    roundRect(ctx, sx0, sy0, sw, 13, 7); ctx.fill();
    var k = clamp((S.v - V_SLOW) / (V_FAST - V_SLOW), 0, 1);
    ctx.fillStyle = k > 0.5 ? '#e2703a' : '#1a90c8';
    roundRect(ctx, sx0, sy0, Math.max(8, sw * (0.18 + k * 0.82)), 13, 7); ctx.fill();
    label('SPEED', sx0, sy0 + 26, 10, 'rgba(18,52,72,.6)', 'left');
  }

  function drawFloats() {
    for (var i = 0; i < S.floats.length; i++) {
      var f = S.floats[i];
      ctx.globalAlpha = clamp(f.life / f.max, 0, 1);
      label(f.text, f.x, f.y, f.size, f.col, 'center', 'rgba(255,255,255,.9)');
    }
    ctx.globalAlpha = 1;
  }

  function drawToast() {
    if (S.toastT <= 0) return;
    ctx.globalAlpha = clamp(S.toastT, 0, 1);
    label(S.toastMsg, view.w / 2, 780, 18, '#123448', 'center', 'rgba(255,255,255,.9)');
    if (S.toastSub) label(S.toastSub, view.w / 2, 814, 14, '#1a6d96', 'center', 'rgba(255,255,255,.85)');
    ctx.globalAlpha = 1;
  }

  /* =========================================================================
     12. UI WIRING
     ========================================================================= */
  var ovMenu = document.getElementById('ovMenu');
  var ovOver = document.getElementById('ovOver');
  var ovPause = document.getElementById('ovPause');
  var elFinal = document.getElementById('finalScore');
  var elBest = document.getElementById('bestScore');
  var elBestLabel = document.getElementById('bestLabel');
  var elRecord = document.getElementById('newRecord');
  var elRunStats = document.getElementById('runStats');
  var elMenuHint = document.getElementById('menuHint');
  var elOverTitle = document.getElementById('overTitle');
  var elTierPick = document.getElementById('tierPick');
  var elSuggest = document.getElementById('suggestBox');
  var elSuggestMsg = document.getElementById('suggestMsg');
  var btnSuggest = document.getElementById('btnSuggest');
  var btnSound = document.getElementById('btnSound');
  var btnPause = document.getElementById('btnPause');

  var ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a9 9 0 0 1 0 12"/></svg>';
  var ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6"/><path d="M22 9l-5 6"/></svg>';
  var ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.4"/><rect x="14" y="5" width="4" height="14" rx="1.4"/></svg>';
  btnPause.innerHTML = ICON_PAUSE;

  function syncSoundIcon() {
    btnSound.innerHTML = (Sound.muted || !Platform.audioAllowed) ? ICON_OFF : ICON_ON;
  }
  function toggleMute() {
    Sound.muted = !Sound.muted;
    Store.data.muted = Sound.muted;
    Store.save();
    Sound.applyVolume();
    syncSoundIcon();
  }
  btnSound.addEventListener('click', function (e) {
    e.stopPropagation(); Sound.boot(); Sound.resumeCtx(); toggleMute();
  });
  btnPause.addEventListener('click', function (e) {
    e.stopPropagation();
    release();
    if (S.mode === 'play') pauseGame();
    else if (S.mode === 'paused') resumeGame();
  });

  var gameOverShown = false;

  function showOverlay(which) {
    ovMenu.hidden = which !== 'menu';
    ovOver.hidden = which !== 'over';
    ovPause.hidden = which !== 'pause';
  }

  function buildTierPicker() {
    elTierPick.innerHTML = '';
    TIERS.forEach(function (T) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'tier';
      b.setAttribute('role', 'radio');
      b.id = 'tier-' + T.id;
      b.dataset.tier = T.id;
      b.innerHTML = '<span class="tn"></span><span class="tb"></span>';
      b.querySelector('.tn').textContent = T.name;
      b.querySelector('.tb').textContent = T.blurb;
      b.addEventListener('click', function () { setTier(T.id); Sound.boot(); Sound.ui(); });
      elTierPick.appendChild(b);
    });
    syncTierPicker();
  }

  function syncTierPicker() {
    var kids = elTierPick.children;
    for (var i = 0; i < kids.length; i++) {
      kids[i].setAttribute('aria-checked', kids[i].dataset.tier === Store.data.tier ? 'true' : 'false');
    }
    syncMenuHint();
  }

  function setTier(id) {
    if (Store.data.tier === id) return;
    Store.data.tier = id;
    Store.data.quickDeaths = 0;
    Store.save();
    resetRun();
    syncTierPicker();
  }

  function syncMenuHint() {
    var T = tierById(Store.data.tier);
    var best = Store.best();
    if (best > 0) {
      elMenuHint.innerHTML =
        '<b>' + T.name + '</b> · ' + T.swifts + ' swifts · reach ' + slackOf(T).toFixed(1) +
        '× the gap<br>best <b>' + fmt(best) + '</b> · ' + fmt(Store.dist()) + ' m in a day · ' +
        Store.climbs() + ' streets topped';
    } else {
      elMenuHint.innerHTML =
        '<b>' + T.name + '</b> · ' + T.swifts + ' swifts · one day, ' + DAY_LEN + ' seconds<br>' +
        '<b>Hold</b> to tuck and dive. <b>Let go</b> to spread and climb.<br>' +
        'The day is short — dash the cool air, work the warm.';
    }
  }

  function startRun() {
    Sound.boot(); Sound.resumeCtx();
    gameOverShown = false;
    resetRun();
    S.mode = 'play';
    S.glideFrom = 0;
    showOverlay(null);
    Sound.ui();
    toast('LET GO TO CLIMB · HOLD TO DIVE', 'one day, ' + DAY_LEN + ' seconds — go as far as you can');
  }

  function showGameOver() {
    gameOverShown = true;
    var T = S.tier;
    var final = Math.floor(S.score);
    var metres = Math.floor(S.x / 10);
    var isRecord = final > Store.best(T.id);
    if (isRecord) Store.data.bests[T.id] = final;
    if (metres > Store.dist(T.id)) Store.data.bestDist[T.id] = metres;
    if (S.topped > Store.climbs(T.id)) Store.data.bestClimbs[T.id] = S.topped;
    Store.data.runs++;

    if (S.topped === 0) Store.data.quickDeaths++;
    else Store.data.quickDeaths = 0;

    elOverTitle.textContent = overTitleText;
    elFinal.textContent = fmt(final);
    elBest.textContent = fmt(Store.best(T.id));
    elBestLabel.textContent = 'Best · ' + T.name;
    elRecord.hidden = !isRecord;
    var mins = Math.floor(S.dayT / 60), secs = Math.floor(S.dayT % 60);
    elRunStats.textContent =
      fmt(metres) + ' m · ' + S.topped + ' topped · ' + S.landings + ' landings · ' +
      mins + 'm' + (secs < 10 ? '0' : '') + secs + 's of day · ' +
      Math.round(S.x / Math.max(1, S.dayT) / 10 * 36) / 10 + ' km/h' +
      (S.swiftsWon ? ' · ' + S.swiftsWon + ' swifts won' : '');

    applySuggestion(T);
    Store.save();
    showOverlay('over');
  }

  var suggestTarget = null;

  function applySuggestion(T) {
    var idx = tierIndex(T.id);
    suggestTarget = null;
    if (Store.data.quickDeaths >= 3 && idx > 0 && !Store.data.offeredDown) {
      suggestTarget = TIERS[idx - 1];
      elSuggestMsg.textContent =
        'Three flights without reaching cloud base. ' + suggestTarget.name +
        ' puts the streets ' + slackOf(suggestTarget).toFixed(1) + '× within reach instead of ' +
        slackOf(T).toFixed(1) + '×.';
      btnSuggest.textContent = 'Switch to ' + suggestTarget.name;
      Store.data.offeredDown = true;
    } else if (S.topped >= 5 && idx < TIERS.length - 1 && !Store.data.offeredUp) {
      suggestTarget = TIERS[idx + 1];
      elSuggestMsg.textContent =
        'Five streets topped. ' + suggestTarget.name + ' spreads them further apart and pays ' +
        suggestTarget.scoreMul + '×.';
      btnSuggest.textContent = 'Try ' + suggestTarget.name;
      Store.data.offeredUp = true;
    }
    elSuggest.hidden = !suggestTarget;
  }

  btnSuggest.addEventListener('click', function () {
    if (!suggestTarget) return;
    setTier(suggestTarget.id);
    startRun();
  });

  function pauseGame() {
    if (S.mode !== 'play') return;
    S.held = false;
    S.mode = 'paused';
    Sound.quiet();
    Sound.hardStop();
    showOverlay('pause');
  }

  function resumeGame() {
    if (S.mode !== 'paused') return;
    Sound.resumeCtx();
    Sound.applyVolume();
    S.mode = 'play';
    S.held = false;
    last = performance.now();
    showOverlay(null);
  }

  function toMenu() {
    S.mode = 'menu';
    resetRun();
    syncTierPicker();
    Sound.quiet();
    showOverlay('menu');
  }

  document.getElementById('btnPlay').addEventListener('click', startRun);
  document.getElementById('btnAgain').addEventListener('click', startRun);
  document.getElementById('btnMenu').addEventListener('click', toMenu);
  document.getElementById('btnResume').addEventListener('click', resumeGame);
  document.getElementById('btnQuit').addEventListener('click', function () {
    if (gameOverShown) return;
    var run = S.x - S.glideFrom;
    if (run > S.longest) S.longest = run;
    S.mode = 'dead'; S.deathT = 0;
    overTitleText = 'Landed Out';
    Sound.quiet();
    showGameOver();
  });

  /* =========================================================================
     13. PLATFORM PAUSE / VISIBILITY
     ========================================================================= */
  var hardPaused = false;

  function platformPause() {
    hardPaused = true;
    S.held = false;
    Sound.hardStop();
    if (S.mode === 'play') pauseGame();
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
  }
  function platformResume() {
    hardPaused = false;
    Sound.resumeCtx();
    Sound.applyVolume();
    last = performance.now();
    if (!raf) raf = requestAnimationFrame(frame);
  }

  Platform.init(platformPause, platformResume, function () {
    Sound.applyVolume();
    syncSoundIcon();
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) platformPause(); else platformResume();
  });
  window.addEventListener('blur', function () {
    if (S.mode === 'play') pauseGame();
  });

  /* =========================================================================
     14. MAIN LOOP
     ========================================================================= */
  var last = 0, raf = 0, painted = false;

  function frame(now) {
    raf = requestAnimationFrame(frame);
    if (hardPaused) return;
    var dt = (now - last) / 1000;
    last = now;
    if (!isFinite(dt) || dt < 0) dt = 0;
    dt = Math.min(dt, 0.05);
    if (S.mode === 'paused') return;   // no rendering at all while paused
    update(dt);
    render();
    if (!painted) { painted = true; Platform.firstFrame(); Platform.ready(); }
  }

  /* =========================================================================
     15. BOOT
     ========================================================================= */
  function boot() {
    layout();
    Sound.muted = !!Store.data.muted;
    syncSoundIcon();
    buildTierPicker();
    resetRun();
    elBest.textContent = fmt(Store.best());
    showOverlay('menu');
    last = performance.now();
    raf = requestAnimationFrame(frame);
  }

  window.addEventListener('resize', layout);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function () { setTimeout(layout, 120); });

  Store.load(boot);
})();
</script>
</body>
</html>
